<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Papers</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Download Past Papers</h1>
        <form action="/papersdownload" method="POST" class="mt-4">
            <div class="mb-3">
                <label for="code" class="form-label">Subject Code</label>
                <input type="text" class="form-control" id="code" name="code" placeholder="Enter subject code (e.g., 0620)" required>
            </div>
            <div class="mb-3">
                <label for="papers" class="form-label">Papers</label>
                <input type="text" class="form-control" id="papers" name="papers" placeholder="Enter paper numbers (e.g., 1,2,3)" required>
            </div>
            <div class="mb-3">
                <label for="variants" class="form-label">Variants</label>
                <input type="text" class="form-control" id="variants" name="variants" placeholder="Enter variants (e.g., 1,2,3)" required>
            </div>
            <button type="submit" class="btn btn-primary">Download</button>
        </form>
    </div>
</body>
</html>
