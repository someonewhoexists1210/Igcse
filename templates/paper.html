<!-- paper.html with real progress bar -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Papers</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center">Download Past Papers</h1>
    <form id="paperForm" class="mt-4">
      <div class="mb-3">
        <label for="code" class="form-label">Subject Code</label>
        <input type="text" class="form-control" id="code" name="code" required>
      </div>
      <div class="mb-3">
        <label for="papers" class="form-label">Papers</label>
        <input type="text" class="form-control" id="papers" name="papers" required>
      </div>
      <div class="mb-3">
        <label for="variants" class="form-label">Variants</label>
        <input type="text" class="form-control" id="variants" name="variants" required>
      </div>
        <div class="mb-3">
            <label for="yearsstart" class="form-label">From year</label>
            <input type="text" class="form-control" id="yearsstart" name="yearsstart" required>
        </div>
      <button type="submit" class="btn btn-primary">Start Download</button>
    </form>

    <div id="status" class="mt-4" style="display: none;">
      <div class="progress" style="height: 25px;">
        <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"
             style="width: 0%;" id="progressBar">0%</div>
      </div>
      <p class="mt-2 text-center" id="progressMsg"></p>
    </div>

    <div id="error" class="mt-3 text-danger text-center" style="display: none;"></div>
  </div>

  <script>
    document.getElementById("paperForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const statusDiv = document.getElementById("status");
      const progressBar = document.getElementById("progressBar");
      const progressMsg = document.getElementById("progressMsg");
      const errorDiv = document.getElementById("error");

      statusDiv.style.display = "block";
      errorDiv.style.display = "none";
      progressBar.style.width = "0%";
      progressBar.innerText = "0%";
      progressMsg.innerText = "Starting...";

      const formData = new FormData(e.target);

      try {
        const res = await fetch("/papersdownload", { method: "POST", body: formData });
        const { task_id } = await res.json();

        const pollInterval = setInterval(async () => {
          const pollRes = await fetch(`/papersdownload/status/${task_id}`);


          if (pollRes.status === 200) {
            clearInterval(pollInterval);
            const blob = await pollRes.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = formData.get("code") + "_papers.zip";
            a.click();
            statusDiv.style.display = "none";
          } else if (pollRes.status === 202) {
            const data = await pollRes.json();
            const progress = data.progress || 0;
            const message = data.message || "Processing...";

            progressBar.style.width = `${progress}%`;
            progressBar.innerText = `${progress}%`;
            progressMsg.innerText = message;

            if (progress >= 100) {
              clearInterval(pollInterval);
              statusDiv.style.display = "none";
            }
          } else if (pollRes.status === 500) {
            const err = await pollRes.json();
            errorDiv.innerText = err.message || "Something went wrong.";
            errorDiv.style.display = "block";
            statusDiv.style.display = "none";
            clearInterval(pollInterval);
          } else {
            
          }
        }, 2000);
      } catch (err) {
        errorDiv.innerText = err.message || "Request failed.";
        errorDiv.style.display = "block";
        statusDiv.style.display = "none";
      }
    });
  </script>
</body>
</html>
